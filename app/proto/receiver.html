<!doctype html>
<html lang="ru" data-look="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E9E9E6" />
    <title>SUSHHH · приёмник (прототип)</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      /* Прототип «приёмник города»: всё, чего нет в основном приложении. Корпус, экран и клавиши — из styles.css */

      /* диапазоны — верхний переключатель вместо списка каналов */
      .bands { margin-top: 0; }

      /* шкала настройки: лента едет под неподвижной стрелкой */
      .dial {
        position: relative;
        height: 60px;
        margin-top: 10px;
        border-radius: 16px;
        background: var(--char);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45), 0 1px 0 #fff;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
        flex: none;
        user-select: none;
      }
      .dial:active { cursor: grabbing; }
      .dial-scale { position: absolute; left: 50%; top: 0; height: 100%; will-change: transform; }
      .dial-ticks {
        position: absolute;
        top: 9px;
        left: -1840px;
        width: 5520px;
        height: 12px;
        background: repeating-linear-gradient(90deg, #6a6b64 0 1px, transparent 1px 11.5px);
      }
      .st {
        position: absolute;
        top: 5px;
        width: 88px;
        margin-left: -44px;
        height: 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        color: #8f9089;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .st i { width: 3px; height: 20px; border-radius: 2px; background: var(--hue); box-shadow: 0 0 0 0 var(--hue); transition: box-shadow 0.2s, height 0.2s; }
      .st span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .st.near { color: #f4f4f0; }
      .st.near i { box-shadow: 0 0 8px 1px var(--hue); }
      .needle { position: absolute; left: 50%; top: 0; height: 29px; width: 2px; margin-left: -1px; background: var(--orange); box-shadow: 0 0 8px var(--orange); pointer-events: none; }
      .dial::before, .dial::after { content: ""; position: absolute; top: 0; bottom: 0; width: 46px; z-index: 2; pointer-events: none; }
      .dial::before { left: 0; background: linear-gradient(90deg, var(--char), transparent); }
      .dial::after { right: 0; background: linear-gradient(270deg, var(--char), transparent); }
      .dial-empty { position: absolute; inset: 0; display: grid; place-items: center; color: #8f9089; font-family: var(--mono); font-size: 10px; font-weight: 800; letter-spacing: 0.05em; }
      .dial-empty[hidden] { display: none; }

      /* экран: главное — кто говорит, время — мелко */
      .sign { position: absolute; right: 14px; top: 36px; display: grid; grid-template-columns: repeat(4, 12px); gap: 5px 6px; font-family: var(--mono); font-size: 14px; font-weight: 600; line-height: 1; color: var(--scr-faint); pointer-events: none; }
      .sign b { color: var(--hue); text-shadow: 0 0 8px var(--hue); }
      .proto-foot { right: 14px; }
      .call { margin: 0; font-family: var(--sans); font-weight: 300; font-size: clamp(26px, 8.6vw, 36px); line-height: 1.05; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .call::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 9px; border-radius: 50%; background: var(--hue); box-shadow: 0 0 10px var(--hue); vertical-align: 0.18em; }
      .proto-foot .hook { cursor: default; margin-top: 4px; }
      .sig { margin: 8px 0 0; display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; color: var(--scr-dim); text-transform: uppercase; white-space: nowrap; }
      .sig .grow { flex: 1; }
      .sig #extra { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .sig #time, .sig .radius, .sig .bars { flex: none; }
      .bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
      .bars i { width: 4px; background: var(--scr-faint); border-radius: 1px; transition: background 0.25s; }
      .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 6px; } .bars i:nth-child(3) { height: 8px; } .bars i:nth-child(4) { height: 10px; } .bars i:nth-child(5) { height: 12px; }
      .bars i.on { background: var(--orange); }
      .bars.up i.on { animation: blink 0.5s steps(2) 3; }
      @keyframes blink { 50% { background: #fff; } }
      .radius { color: var(--scr-ink); font-weight: 800; }
      .rumor { color: var(--orange); font-weight: 800; }

      /* под экраном: клавиши памяти, решётка, эхо */
      .mem { width: 40px; height: 36px; flex: none; border-radius: 10px; background: #111; color: #f4f4f0; display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--mono); font-size: 10px; font-weight: 800; }
      .mem i { width: 6px; height: 6px; border-radius: 50%; background: var(--led-off); }
      .mem.set i { background: var(--hue); box-shadow: 0 0 6px var(--hue); }
      .mem:active { transform: translateY(1px); }
      .mem.saving { outline: 2px solid var(--orange); }
      .strip { gap: 6px; }
      .grille-dots { flex: 1; min-width: 0; height: 36px; background: radial-gradient(circle, #c9cac3 1.3px, transparent 1.6px) 0 0 / 7px 7px; opacity: 0.9; }
      .label-pill .ico { width: 14px; height: 14px; }

      /* пэды эмоций */
      .pad .cap-btn { font-size: 16px; line-height: 1; }
      .pad.rec { background: var(--orange); box-shadow: inset 0 -1px 0 var(--orange-edge); transform: translateY(2px); }
      .pad.rec small { color: var(--orange-ink); }
      .pad.own::after { content: ""; position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 6px var(--orange); }
      .pad.hit .cap-btn { animation: pop 0.35s var(--spring); }

      @media (prefers-reduced-motion: reduce) {
        .bars.up i.on, .pad.hit .cap-btn { animation: none; }
      }
    </style>
  </head>
  <body>
    <section class="app">
      <!-- диапазоны -->
      <nav class="switch3 bands" aria-label="Диапазон">
        <button class="pos on" data-band="city"><i class="led"></i><span>ГОРОД</span></button>
        <button class="pos" data-band="own"><i class="led"></i><span>СВОИ</span></button>
        <button class="pos" data-band="rumor"><i class="led"></i><span>СЛУХИ</span></button>
      </nav>

      <!-- шкала настройки -->
      <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Настройка: веди, чтобы найти голос" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1">
        <div class="dial-scale" id="scale"><div class="dial-ticks"></div></div>
        <div class="needle"></div>
        <p class="dial-empty" id="dialEmpty" hidden>ПУСТО · УДЕРЖИ M НА ГОЛОСЕ, ЧТОБЫ СОХРАНИТЬ</p>
      </div>

      <div class="device">
        <div class="bezel">
          <div class="screen" id="stage">
            <canvas id="cv"></canvas>
            <div class="scr-status" aria-hidden="true"><span id="clock"></span><span class="rec-dot"></span><span id="mode">В ЭФИРЕ</span><span class="grow"></span><span id="hall">ЗАЛ ВКЛ</span><span id="count"></span></div>
            <div class="sign" id="sign" aria-hidden="true"></div>
            <button class="start" id="startBtn"></button>
            <div class="floaters" id="floaters"></div>
            <div class="scr-foot proto-foot">
              <p class="call" id="call"></p>
              <p class="hook" id="hook"></p>
              <p class="sig"><span class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></span><span class="radius" id="radius"></span><span id="extra"></span><span class="grow"></span><span id="time"></span></p>
              <div class="hair"><i id="hairFill"></i></div>
            </div>
            <p class="sr-only" aria-live="polite" id="live"></p>
          </div>
        </div>
        <button class="knob" id="knob" aria-label="Зал: слышать реакции других" aria-pressed="true"></button>
      </div>

      <div class="strip">
        <button class="mem" data-m="0"><i></i>M1</button>
        <button class="mem" data-m="1"><i></i>M2</button>
        <button class="mem" data-m="2"><i></i>M3</button>
        <button class="mem" data-m="3"><i></i>M4</button>
        <div class="grille-dots" aria-hidden="true"></div>
        <button class="label-pill" id="echo" aria-label="Эхо: передать своим слушателям"></button>
      </div>

      <div class="keys">
        <button class="keycap big" id="playKey" aria-label="Слушать или пауза"><span class="cap-btn" id="playIco"></span><span class="cap-label"><b id="playWord">"СЛУШАТЬ"</b><small id="playSub"></small></span></button>
        <button class="keycap big orange" id="reply" aria-label="Ответить голосом"><span class="cap-btn" id="micIco"></span><span class="cap-label"><b>"ОТВЕТИТЬ"</b><small>15 С</small></span></button>
        <button class="keycap pad" data-pad="0"><span class="cap-btn sm"></span><span class="cap-label"><b></b><small></small></span></button>
        <button class="keycap pad" data-pad="1"><span class="cap-btn sm"></span><span class="cap-label"><b></b><small></small></span></button>
        <button class="keycap pad" data-pad="2"><span class="cap-btn sm"></span><span class="cap-label"><b></b><small></small></span></button>
        <button class="keycap pad" data-pad="3"><span class="cap-btn sm"></span><span class="cap-label"><b></b><small></small></span></button>
      </div>

      <nav class="switch3" aria-label="Разделы">
        <button class="pos on"><i class="led"></i><span>ЭФИР</span></button>
        <button class="pos" data-stub><i class="led"></i><span>ЗАПИСЬ</span></button>
        <button class="pos" data-stub><i class="led"></i><span>МОЁ</span></button>
      </nav>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="./receiver.ts"></script>
  </body>
</html>
