<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E8EDF4" />
    <title>SUSHHH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&family=Unbounded:wght@300;400;500&display=swap" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- перелив «единорога» для выбранных иконок -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="uni" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7fd8ea" />
          <stop offset="0.35" stop-color="#a48cf2" />
          <stop offset="0.65" stop-color="#ee8fcd" />
          <stop offset="1" stop-color="#7fe0b0" />
        </linearGradient>
      </defs>
    </svg>
    <!-- эфир: радио. Кольцо играет поток; внутри — автор и время -->
    <section class="app view" id="home">
      <header class="top">
        <button class="pill chan" id="chanBtn" aria-haspopup="dialog"><span id="chanName"></span><i data-i="down"></i></button>
        <button class="pill icon-only" id="moreBtn" data-i18n-aria="more" aria-haspopup="dialog"><i data-i="dots"></i></button>
      </header>

      <div class="stories" id="stories" data-i18n-aria="storiesAria"></div>

      <div class="context" id="context" hidden>
        <button class="pill icon-only" id="back" data-i18n-aria="backHome"><i data-i="left"></i></button>
        <div class="segments" id="segments"></div>
      </div>

      <div class="stage" id="stage" data-i18n-aria="stageAria">
        <div class="orb" id="orb" aria-hidden="true"><div class="orb-rim"></div><span class="orb-tag" id="orbTag"></span><div class="eyes"><i></i><i></i></div></div>
        <canvas id="cv"></canvas>
        <button class="start" id="startBtn" data-i18n-aria="startAria"><i data-i="play"></i></button>
        <div class="floaters" id="floaters"></div>
        <p class="sr-only" aria-live="polite" id="live"></p>
      </div>

      <p class="who" id="who"></p>
      <div class="hair" id="hair" role="slider" tabindex="0" data-i18n-aria="hairAria" aria-valuemin="0" aria-valuemax="100"><i id="hairFill"></i></div>
      <p class="hook" id="hook" role="button" tabindex="0" data-i18n-aria="hookAria"></p>
      <p class="transcript" id="transcript" hidden></p>

      <div class="actions">
        <button class="pill" id="heartBtn" data-i18n-aria="heartAria"><i data-i="heart"></i><small id="heartCount"></small></button>
        <button class="pill" id="thread" data-i18n-aria="threadAria"><i data-i="message"></i><small id="threadCount"></small></button>
        <button class="pill icon-only" id="laterBtn" data-i18n-aria="laterAria"><i data-i="clock"></i></button>
        <span class="grow"></span>
        <button class="pill dark icon-only" id="reply" data-i18n-aria="replyAria"><i data-i="mic"></i></button>
        <div class="fan" id="fan" hidden></div>
      </div>
      <!-- вид «плитка»: время записи и точки очереди, как часы и страницы на экране блокировки -->
      <p class="clock" id="clock" aria-hidden="true"></p>
      <div class="dots" id="dots" aria-hidden="true"></div>

      <nav class="tabbar" data-i18n-aria="sectionsAria">
        <button class="tab on" data-go="home" data-i18n-aria="air" aria-current="page"><i data-i="headphones"></i></button>
        <button class="tab" data-rec data-i18n-aria="tabRec"><i data-i="mic"></i></button>
        <button class="tab" data-go="mine" data-i18n-aria="tabMine"><i data-i="inbox"></i><b class="badge" data-badge hidden></b></button>
      </nav>
    </section>

    <!-- моё: тоже для слушания — новые ответы одной кнопкой, остальное кольцами -->
    <section class="app view" id="mine" hidden>
      <button class="me-head" id="meOpen" data-i18n-aria="openProfile"><canvas id="meThumb"></canvas><span id="meHeadName"></span><i data-i="right"></i></button>
      <button class="pill dark big-play" id="playNew"><i data-i="play"></i><span id="playNewText"></span></button>
      <div class="seg-tabs" role="tablist">
        <button class="pill icon-only on" data-tab="toMe" role="tab" data-i18n-aria="tabToMe"><i data-i="message"></i></button>
        <button class="pill icon-only" data-tab="later" role="tab" data-i18n-aria="laterAria"><i data-i="clock"></i></button>
        <button class="pill icon-only" data-tab="posts" role="tab" data-i18n-aria="tabPosts"><i data-i="mic"></i></button>
        <button class="pill icon-only" data-tab="sounds" role="tab" data-i18n-aria="tabSounds"><i data-i="wave"></i></button>
      </div>
      <div class="grid" id="grid"></div>

      <nav class="tabbar" data-i18n-aria="sectionsAria">
        <button class="tab" data-go="home" data-i18n-aria="air"><i data-i="headphones"></i></button>
        <button class="tab" data-rec data-i18n-aria="tabRec"><i data-i="mic"></i></button>
        <button class="tab on" data-go="mine" data-i18n-aria="tabMine" aria-current="page"><i data-i="inbox"></i><b class="badge" data-badge hidden></b></button>
      </nav>
    </section>

    <!-- личный кабинет: мой персонаж, псевдоним, тихая статистика, настройки и данные -->
    <section class="app view me-view" id="me" hidden>
      <header class="top">
        <button class="pill icon-only" id="meBack" data-i18n-aria="backMine"><i data-i="left"></i></button>
      </header>
      <div class="me-scroll">
      <div class="stage me-stage" id="meStage" role="button" tabindex="0" data-i18n-aria="meOrbAria">
        <div class="orb" id="meOrb" aria-hidden="true"><div class="orb-rim"></div><span class="orb-tag"></span><div class="eyes"><i></i><i></i></div></div>
      </div>
      <p class="who" id="meName"></p>
      <button class="pill quiet me-rename" id="meRename"><i data-i="rotate"></i><span data-i18n="newName"></span></button>
      <p class="me-note" data-i18n="nameNote"></p>
      <div class="me-stats" id="meStats" role="group" data-i18n-aria="statsAria"></div>
      <div class="me-list" id="meList"></div>
      </div>
      <nav class="tabbar" data-i18n-aria="sectionsAria">
        <button class="tab" data-go="home" data-i18n-aria="air"><i data-i="headphones"></i></button>
        <button class="tab" data-rec data-i18n-aria="tabRec"><i data-i="mic"></i></button>
        <button class="tab on" data-go="mine" data-i18n-aria="tabMine" aria-current="page"><i data-i="inbox"></i><b class="badge" data-badge hidden></b></button>
      </nav>
    </section>

    <!-- запись: пост до 30 с, ответ до 15 с -->
    <div class="recorder" id="recorder" hidden>
      <header class="top">
        <span class="pill" id="recWhat"></span>
        <button class="pill icon-only" id="close" data-i18n-aria="close"><i data-i="x"></i></button>
      </header>
      <div class="stage" id="recStage"><div class="orb listen" id="recOrb" aria-hidden="true"><div class="orb-rim"></div><span class="orb-tag"></span><div class="eyes"><i></i><i></i></div></div><canvas id="cv2"></canvas></div>
      <p class="who big" id="recTime">0:00</p>
      <div class="hair"><i id="recHairFill"></i></div>
      <p class="rec-text" id="recText"></p>
      <p class="rec-note" id="recNote"></p>
      <div class="rec-controls" id="recIdle">
        <button class="rec-btn" id="recBtn" data-i18n-aria="startRec"><i data-i="mic"></i></button>
      </div>
      <div class="rec-controls" id="recDone" hidden>
        <button class="pill icon-only" id="again" data-i18n-aria="again"><i data-i="rotate"></i></button>
        <button class="pill icon-only" id="listenBack" data-i18n-aria="listenBack"><i data-i="play"></i></button>
        <button class="pill dark" id="publish" data-i18n-aria="publish"><i data-i="send"></i></button>
      </div>
    </div>

    <!-- лист действий -->
    <div class="sheet-backdrop" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
        <div class="sheet-grip"></div>
        <p class="sheet-title" id="sheetTitle"></p>
        <p class="sheet-sub" id="sheetSub"></p>
        <div class="sheet-body" id="sheetBody"></div>
        <button class="pill cancel" id="sheetCancel" data-i18n="cancel"></button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
