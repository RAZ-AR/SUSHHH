<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- SUSHHH: стеклянная капсула, со дна поднимается сияние голоса — как главный экран v2.
       Без clipPath и фильтров: генератор PNG-иконок их не рисует, поэтому пятна света лежат внутри капсулы -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e23" />
      <stop offset="0.45" stop-color="#17171b" />
      <stop offset="1" stop-color="#2a1630" />
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="330" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4678" stop-opacity="0.5" />
      <stop offset="0.55" stop-color="#af46ff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#0b0b0c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet" cx="256" cy="420" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#af46ff" />
      <stop offset="1" stop-color="#af46ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blue" cx="206" cy="400" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3cbeff" />
      <stop offset="1" stop-color="#3cbeff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amber" cx="306" cy="400" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9628" />
      <stop offset="1" stop-color="#ff9628" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pink" cx="256" cy="392" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4678" />
      <stop offset="0.6" stop-color="#ff4678" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ff4678" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core" cx="256" cy="414" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0b0b0c" />
  <circle cx="256" cy="330" r="240" fill="url(#halo)" />

  <!-- капсула 184×360, низ — полукруг с центром (256, 344) и радиусом 92 -->
  <rect x="164" y="76" width="184" height="360" rx="92" fill="url(#glass)" />
  <ellipse cx="256" cy="372" rx="88" ry="84" fill="url(#violet)" opacity="0.8" />
  <ellipse cx="214" cy="378" rx="50" ry="56" fill="url(#blue)" opacity="0.9" />
  <ellipse cx="298" cy="378" rx="50" ry="56" fill="url(#amber)" opacity="0.9" />
  <ellipse cx="256" cy="366" rx="84" ry="78" fill="url(#pink)" />
  <ellipse cx="256" cy="402" rx="44" ry="26" fill="url(#core)" />
  <rect x="164" y="76" width="184" height="360" rx="92" fill="none" stroke="url(#rim)" stroke-width="6" />
</svg>
