<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>SUSHHH · v2</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <style>
      /* SUSHHH v2 «капсула» в стиле сияния libraries.dev/voice:
         чёрный экран, тёмное стекло, цвет есть только там, где звучит голос — он поднимается со дна светом. */
      :root {
        --ink: #f4f4f5; /* текст */
        --ink-2: rgba(244, 244, 245, 0.62); /* вторичный текст */
        --page: #0b0b0c; /* экран */
        --panel: #141416; /* лист */
        --card: rgba(255, 255, 255, 0.055); /* стеклянный овал */
        --well: #1d1d20; /* дно маленькой капсулы */
        --cap-a: #17171a; /* стекло большой капсулы, верх и низ */
        --cap-b: #0f0f11;
        --glass: rgba(255, 255, 255, 0.07); /* кнопки и строки */
        --glass-on: rgba(255, 255, 255, 0.13);
        --edge: rgba(255, 255, 255, 0.09); /* тонкая кромка стекла */
        --edge-on: rgba(255, 255, 255, 0.28); /* кромка выбранного */
        --dock: rgba(24, 24, 27, 0.78);
        --main: #fff; /* главная кнопка */
        --main-ink: #0b0b0c;
        --scrim: rgba(0, 0, 0, 0.6);
        --frame: #232326;
        --tile-glow: 0.55; /* сила сияния на невыбранной плитке */
        --shine: rgba(255, 255, 255, 0.1); /* блик по верхней кромке стекла */
        --hot: rgb(255, 70, 120); /* слушаешь */
        --live: rgb(60, 220, 130); /* говоришь */
        --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        color-scheme: dark;
      }
      /* светлая тема: тот же свет со дна, но на белом стекле */
      :root[data-theme="light"] {
        --ink: #17171a;
        --ink-2: rgba(23, 23, 26, 0.64);
        --page: #f1f1ef;
        --panel: #f8f8f6;
        --card: rgba(255, 255, 255, 0.72);
        --shine: rgba(255, 255, 255, 0.9);
        --well: #e6e6e3;
        --cap-a: #fff;
        --cap-b: #f6f6f4;
        --glass: rgba(0, 0, 0, 0.055);
        --glass-on: rgba(0, 0, 0, 0.1);
        --edge: rgba(0, 0, 0, 0.08);
        --edge-on: rgba(0, 0, 0, 0.4);
        --dock: rgba(255, 255, 255, 0.82);
        --main: #17171a;
        --main-ink: #fff;
        --scrim: rgba(30, 30, 28, 0.35);
        --frame: #d5d5d2;
        --tile-glow: 0.75;
        --live: rgb(40, 190, 105);
        color-scheme: light;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; overflow: hidden; background: color-mix(in srgb, var(--page), #000 35%); }
      body {
        display: grid;
        place-items: center;
        font-family: "Inter Tight", system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

      .stage {
        --c: var(--hot); /* цвет голоса: розовый — слушаешь, зелёный — говоришь */
        --s: 0.42; /* размер капсулы */
        --b: 0.75; /* яркость капсулы */
        --ring: 0; /* контуры: запись готова */
        --bg: 0.2; /* насколько свет голоса заливает экран */
        --lv: 0; /* громкость сейчас */
        position: relative;
        width: min(100vw, 430px);
        height: min(100dvh, 900px);
        overflow: hidden;
        background: var(--page);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      @media (min-width: 500px) {
        .stage { border-radius: 44px; box-shadow: 0 0 0 1px var(--frame); }
      }

      /* отсвет голоса на экране: поднимается из-под капсулы */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 46% at 50% 72%, var(--c), transparent 72%);
        opacity: calc(var(--bg) * 0.26);
      }
      .shape {
        position: absolute;
        left: 50%;
        top: 55%;
        width: min(58%, 29dvh);
        aspect-ratio: 1 / 1.85;
        border-radius: 999px;
        translate: calc(-50% + var(--dx, 0px)) calc(-50% + var(--dy, 0px)); /* овал тянется за пальцем */
        transition: translate 0.3s var(--ease);
        will-change: transform, opacity;
      }
      .stage.dragging .shape { transition: none; }
      /* свечение вокруг овала: растёт и ярчает от громкости, цвет медленно плывёт */
      .halo {
        scale: calc(var(--s) * (1.04 + var(--lv) * 0.12));
        background: var(--c);
        opacity: calc(var(--b) * (0.2 + var(--lv) * 0.5));
        filter: blur(44px);
        animation: drift 11s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from { filter: blur(44px) hue-rotate(-28deg); }
        to { filter: blur(44px) hue-rotate(46deg); }
      }
      /* капсула — тёмное стекло; сияние внутри рисует библиотека voice-glow */
      .cap { scale: var(--s); opacity: var(--b); box-shadow: 0 0 0 1px var(--edge), 0 30px 80px rgba(0, 0, 0, 0.18); }
      .cap > div, .cap-fill { width: 100%; height: 100%; border-radius: 999px; }
      .cap-fill { background: linear-gradient(var(--cap-a), var(--cap-b)); }
      .ring {
        scale: calc(var(--s) * (1 + var(--ring) * var(--k)));
        opacity: calc(var(--ring) * (0.5 - var(--k) * 0.6));
        border: 1px solid var(--c);
      }

      .top { position: absolute; inset: max(14px, env(safe-area-inset-top)) 14px auto; text-align: center; }
      .bar { display: flex; align-items: center; gap: 8px; }
      .bar [hidden] { display: none; }
      .grow { flex: 1; }
      .meta { padding: 0 30px; }
      .who { font-size: 16px; font-weight: 400; padding-top: 2px; overflow-wrap: anywhere; }
      .hook, .hint { font-size: 13.5px; font-weight: 300; color: var(--ink-2); margin-top: 4px; line-height: 1.35; text-wrap: balance; }
      .hint { min-height: 18px; font-variant-numeric: tabular-nums; }
      
      .small {
        position: relative;
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--glass);
        box-shadow: inset 0 0 0 1px var(--edge);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: scale 0.15s, background 0.2s;
      }
      .small:hover { background: var(--glass-on); }
      .small:active { scale: 0.9; }
      .small svg { width: 19px; height: 19px; }
      .small.on { background: var(--hot); color: #fff; box-shadow: 0 0 24px rgba(255, 70, 120, 0.55); }
      .bottom .small[hidden] { display: grid; visibility: hidden; }
      .badge {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--hot);
        color: #14060b;
        font-size: 11px;
        font-weight: 400;
        line-height: 18px;
        font-variant-numeric: tabular-nums;
      }

      .pill {
        height: 44px;
        padding: 0 16px;
        border-radius: 22px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        background: var(--glass);
        box-shadow: inset 0 0 0 1px var(--edge);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: scale 0.15s, background 0.2s;
      }
      .pill:hover { background: var(--glass-on); }
      .pill:active { scale: 0.96; }
      .pill svg { width: 14px; height: 14px; }
      .pill.hot { background: var(--hot); color: #14060b; box-shadow: 0 0 28px rgba(255, 70, 120, 0.45); }

      .bottom {
        position: absolute;
        inset: auto 22px max(26px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }
      .side { display: grid; justify-items: center; gap: 8px; width: 72px; }
      .side.end { justify-self: end; }
      .bottom.air .side { width: 44px; }
      .bottom.air .label { display: none; }

      /* эффекты для своей записи: ряд стеклянных овалов над кнопками */
      .fx { position: absolute; inset: auto 0 calc(max(26px, env(safe-area-inset-bottom)) + 118px); display: flex; gap: 8px; padding: 4px 18px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
      .fx::-webkit-scrollbar { display: none; }
      .fx:empty { display: none; }
      .fxb {
        flex: none;
        height: 48px;
        padding: 0 20px;
        border-radius: 999px;
        font-size: 13.5px;
        color: var(--ink-2);
        background: var(--card);
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine);
        transition: scale 0.15s, color 0.2s;
      }
      .fxb:active { scale: 0.95; }
      .fxb[aria-pressed="true"] {
        color: var(--ink);
        box-shadow: inset 0 0 0 1.5px var(--edge-on);
        background: radial-gradient(ellipse 60% 70% at 50% 118%, var(--live), transparent 72%), var(--card);
      }

      /* аудио-эмодзи: сердце раскрывает стеклянную панель, каждый овал — реакция со звуком */
      .tray {
        position: absolute;
        inset: auto 16px calc(max(18px, env(safe-area-inset-bottom)) + 140px);
        z-index: 3;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px 6px;
        padding: 12px;
        border-radius: 40px;
        background: var(--dock);
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine), 0 20px 50px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        transform-origin: 8% 100%;
        opacity: 0;
        scale: 0.9;
        translate: 0 10px;
        visibility: hidden;
        transition: opacity 0.2s, scale 0.24s var(--ease), translate 0.24s var(--ease), visibility 0s 0.24s;
      }
      .tray.open { opacity: 1; scale: 1; translate: 0; visibility: visible; transition-delay: 0s; }
      /* эмодзи — стеклянные овалы: свет своего цвета со дна, переливающаяся кромка, объём от тени */
      .rx {
        position: relative;
        isolation: isolate;
        aspect-ratio: 1 / 1.32;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 25px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 34% 22% at 50% 104%, rgba(255, 255, 255, 0.7), transparent 70%),
          radial-gradient(ellipse 80% 52% at 50% 110%, var(--ec), transparent 74%),
          var(--card);
        box-shadow: inset 0 1px 0 var(--shine), 0 10px 22px -12px var(--ec);
        transition: scale 0.15s, box-shadow 0.2s;
      }
      .rx::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        padding: 1.5px;
        border-radius: inherit;
        background: conic-gradient(from var(--ang), #ff4678, #ffc83c, #3cdc82, #3cbeff, #af46ff, #ff4678);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.6;
        animation: spin 5s linear infinite;
      }
      /* блик пробегает по стеклу — эмодзи переливаются */
      .rx::after {
        content: "";
        position: absolute;
        inset: -20% -60%;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.55) 50%, transparent 62%);
        mix-blend-mode: soft-light;
        translate: -60% 0;
        animation: sheen 3.8s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.16s);
      }
      .rx .e {
        display: block;
        filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.28)) drop-shadow(0 0 9px color-mix(in srgb, var(--ec) 75%, transparent));
        animation: bob 3.4s ease-in-out infinite;
        animation-delay: calc(var(--i) * -0.29s);
      }
      .rx:hover { box-shadow: inset 0 1px 0 var(--shine), 0 12px 26px -10px var(--ec); }
      .rx:active { scale: 0.86; }
      .tray.open .rx { animation: pop 0.52s var(--spring) backwards; animation-delay: calc(var(--i) * 26ms); }
      @property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
      @keyframes spin { to { --ang: 360deg; } }
      @keyframes sheen { 0%, 55% { translate: -60% 0; } 100% { translate: 60% 0; } }
      @keyframes bob { 50% { translate: 0 -3px; scale: 1.07; } }
      @keyframes pop { from { scale: 0.3; opacity: 0; } 60% { scale: 1.14; opacity: 1; } to { scale: 1; } }
      @keyframes ping { 40% { scale: 1.5; } }

      /* взлетающие эмодзи: крупные, со своим светом и тенью */
      .flyer {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 4;
        font-size: 32px;
        pointer-events: none;
        will-change: transform, opacity;
        filter: drop-shadow(0 0 14px var(--ec)) drop-shadow(0 6px 8px rgba(0, 0, 0, 0.3));
      }

      /* ===== дорожка записи: стеклянная полоса с волной, бегунком и реакциями ===== */
      .track {
        --p: 0;
        --a: -1;
        position: absolute;
        z-index: 2;
        left: 76px;
        right: 76px;
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 84px);
        height: 44px;
        border-radius: 999px;
        background: var(--card);
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        cursor: pointer;
        touch-action: none;
      }
      .track:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .wave { position: absolute; inset: 11px 16px; display: flex; align-items: center; gap: 2px; pointer-events: none; }
      .wave i { flex: 1; height: calc(var(--h) * 100%); min-height: 2px; border-radius: 2px; background: var(--ink); opacity: 0.2; }
      .wave.lit { clip-path: inset(0 calc((1 - var(--p)) * 100%) 0 0); }
      .wave.lit i { opacity: 1; background: linear-gradient(to top, var(--hot), #af46ff); }
      .head, .anchor { position: absolute; pointer-events: none; }
      .head { top: 7px; bottom: 7px; width: 2px; border-radius: 1px; background: var(--ink); left: calc(16px + var(--p) * (100% - 32px)); translate: -50% 0; }
      /* место, куда встанет реакция, пока открыта панель */
      .anchor {
        top: 50%;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        left: calc(16px + var(--a) * (100% - 32px));
        translate: -50% -50%;
        border: 2px solid var(--hot);
        box-shadow: 0 0 14px var(--hot);
        opacity: 0;
        transition: opacity 0.2s, left 0.2s var(--ease);
      }
      .track.anchoring .anchor { opacity: 1; }
      .pins { position: absolute; inset: 0 16px; pointer-events: none; }
      .pin {
        position: absolute;
        bottom: calc(100% + 4px);
        left: calc(var(--x) * 100%);
        translate: -50% 0;
        width: 26px;
        height: 32px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 14px;
        background: radial-gradient(ellipse 80% 50% at 50% 110%, var(--ec), transparent 74%), var(--card);
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine), 0 6px 14px -8px var(--ec);
      }
      .pin.mine { box-shadow: inset 0 0 0 1.5px var(--live), inset 0 1px 0 var(--shine), 0 6px 14px -6px var(--ec); }
      .pin.new { animation: pop 0.55s var(--spring) backwards; }
      .pin.ping { animation: ping 0.6s var(--spring); }
      .stage.busy .track { display: none; }
      .stage.busy .tray { display: none; }
      /* в эфире главную кнопку заменяет микрофон dock'а, сердце и ветка стоят над ним */
      .bottom.air { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 84px); }
      .bottom.air .mainwrap { visibility: hidden; }
      .mainwrap { display: grid; justify-items: center; gap: 8px; }
      .main {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: var(--main);
        color: var(--main-ink);
        display: grid;
        place-items: center;
        transition: scale 0.15s, opacity 0.3s;
      }
      .main:active { scale: 0.92; }
      .main:disabled { opacity: 0.4; }
      .main svg { width: 30px; height: 30px; }
      .label { font-size: 12.5px; color: var(--ink-2); height: 15px; }

      /* маленькая капсула голоса: свет со дна, как у большой. Розовая — чужой голос, зелёная — твой */
      .dot {
        --g: 0;
        --dc: var(--hot);
        display: block;
        width: 18px;
        height: 36px;
        border-radius: 999px;
        justify-self: center;
        box-shadow: inset 0 0 0 1px var(--edge);
        background: linear-gradient(to top, var(--dc), transparent calc(45% + var(--g) * 55%)), var(--well);
      }
      .mine .dot, .me .dot, .small .dot { --dc: var(--live); }
      .small .dot { width: 11px; height: 20px; }

      /* ===== листы: каналы, ветка, «Моё» ===== */
      .scrim {
        position: absolute;
        inset: 0;
        z-index: 4;
        background: var(--scrim);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .scrim.open { opacity: 1; pointer-events: auto; }
      .sheet {
        position: absolute;
        inset: auto 0 0;
        z-index: 5;
        max-height: 100%;
        overflow-y: auto;
        touch-action: pan-y;
        padding: 12px 18px max(22px, env(safe-area-inset-bottom));
        border-radius: 36px 36px 0 0;
        background: var(--panel);
        box-shadow: inset 0 1px 0 var(--edge);
        transform: translateY(105%);
        visibility: hidden;
        transition: transform 0.38s var(--ease), visibility 0s 0.38s;
      }
      .sheet.full { height: 100%; border-radius: 0; padding-top: max(14px, env(safe-area-inset-top)); background: var(--page); box-shadow: none; }
      .sheet.open { transform: none; visibility: visible; transition-delay: 0s; }
      .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--edge-on); margin: 0 auto 14px; }
      .sh-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; text-align: center; margin-bottom: 16px; }
      .sh-title { font-size: 15px; }
      .sh-title.lone { text-align: center; margin-bottom: 16px; }
      .sh-sub { font-size: 12.5px; font-weight: 300; color: var(--ink-2); margin-top: 2px; }

      /* плитка: тёмное стекло, со дна поднимается сияние — тот же приём, что у капсулы */
      .tiles { display: grid; gap: 10px; margin-bottom: 16px; }
      .tile {
        --t1: var(--hot);
        --t2: rgb(175, 70, 255);
        --t3: rgb(255, 150, 40);
        --g: 0;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 78px;
        padding: 14px 58px 14px 28px;
        border-radius: 999px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        text-align: left;
        background: var(--card);
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: scale 0.15s;
      }
      .tile.green { --t1: var(--live); --t2: rgb(60, 190, 255); --t3: rgb(190, 240, 60); }
      .tile.wide { min-height: 104px; }
      .tile:active { scale: 0.97; }
      .tile::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        transform-origin: bottom;
        scale: 1 calc(0.75 + var(--g) * 0.7);
        opacity: var(--tile-glow);
        transition: opacity 0.25s;
        background:
          radial-gradient(ellipse 34% 46% at 50% 104%, rgba(255, 255, 255, 0.55), transparent 70%),
          radial-gradient(ellipse 52% 62% at 50% 106%, var(--t1), transparent 72%),
          radial-gradient(ellipse 44% 54% at 14% 108%, var(--t2), transparent 72%),
          radial-gradient(ellipse 44% 54% at 86% 108%, var(--t3), transparent 72%);
      }
      .tile[aria-pressed="true"]::before, .tile.wide::before, .tile.playing::before { opacity: 1; }
      .tile[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--edge-on); }
      .tile.playing { --g: var(--lv); }
      .tile b { font-size: 16px; font-weight: 400; overflow-wrap: anywhere; }
      .tile span { font-size: 12.5px; font-weight: 300; color: var(--ink-2); line-height: 1.3; }
      .tile .tick { position: absolute; top: 50%; right: 24px; translate: 0 -50%; color: var(--ink); }
      /* вертикальный овал: мои записи, листаются вбок */
      .vrow { display: flex; gap: 10px; margin: 0 -18px; padding: 2px 18px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x pan-y; }
      .vrow::-webkit-scrollbar { display: none; }
      .tile.tall { flex: none; width: 112px; min-height: 190px; padding: 26px 14px 24px; align-items: center; justify-content: flex-start; gap: 10px; text-align: center; }
      .tile.tall .tick { position: static; translate: none; }
      .tile.tall .count { margin-top: auto; color: var(--ink); }
      .tile.tall.add { justify-content: center; color: var(--ink); }
      .tile.tall.add b { font-size: 13px; }
      .tile.tall.add svg { width: 26px; height: 26px; }
      .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; color: var(--ink) !important; font-size: 13px !important; }
      .sec { font-size: 13px; font-weight: 400; color: var(--ink-2); margin: 22px 4px 10px; }
      .tile .tick svg { width: 20px; height: 20px; display: block; }

      .row {
        display: grid;
        grid-template-columns: 26px 1fr 24px;
        gap: 12px;
        align-items: center;
        width: 100%;
        min-height: 70px;
        margin-top: 8px;
        padding: 12px 24px 12px 20px;
        border-radius: 999px;
        text-align: left;
        background: var(--card);
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine);
        transition: background 0.2s, scale 0.15s;
      }
      .row:hover { background: var(--glass-on); }
      .row:active { scale: 0.98; }
      .row.playing { background: var(--glass-on); box-shadow: inset 0 0 0 1.5px var(--edge-on); }
      .row.playing .dot { --g: var(--lv); }
      .txt { display: grid; gap: 2px; min-width: 0; }
      .txt b { font-size: 14.5px; font-weight: 400; overflow-wrap: anywhere; }
      .txt span { font-size: 13px; font-weight: 300; color: var(--ink-2); line-height: 1.3; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
      .ico svg { width: 20px; height: 20px; display: block; opacity: 0.8; }
      .empty { text-align: center; font-size: 14px; font-weight: 300; color: var(--ink-2); line-height: 1.5; padding: 34px 0 10px; }

      .me { display: flex; align-items: center; gap: 14px; margin: 4px 4px 18px; }
      .me .dot.big { width: 44px; height: 78px; }
      .me b { display: block; font-size: 18px; font-weight: 400; }
      .me span:not(.dot) { font-size: 13px; font-weight: 300; color: var(--ink-2); }
      .sheet > .pill { margin-bottom: 14px; }

      .sh-foot {
        position: sticky;
        bottom: 0;
        display: grid;
        justify-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 26px 0 4px;
        background: linear-gradient(transparent, var(--page) 42%);
      }

      /* ===== страницы разделов: главная и «Моё» ===== */
      .page {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow-y: auto;
        touch-action: pan-y;
        padding: max(18px, env(safe-area-inset-top)) 18px 118px;
        background: var(--page);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s, visibility 0s 0.2s;
      }
      .page.open { opacity: 1; visibility: visible; transition-delay: 0s; }
      .page > .pill { margin-bottom: 14px; }
      .me > .small { margin-left: auto; }

      /* ===== сторис: ряд горизонтальных стеклянных овалов, листается вбок. Первый — ты, остальные — голоса эфира ===== */
      .stories {
        display: flex;
        gap: 8px;
        margin: 0 -14px;
        padding: 6px 14px;
        overflow-x: auto;
        scrollbar-width: none;
        scroll-snap-type: x proximity;
        touch-action: pan-x;
      }
      .stories::-webkit-scrollbar { display: none; }
      .stories:empty { display: none; }
      .st { flex: none; scroll-snap-align: center; border-radius: 999px; color: var(--ink-2); transition: opacity 0.25s, color 0.2s; }
      .oval {
        --g: 0;
        --dc: var(--hot);
        width: 128px;
        height: 78px;
        padding: 15px 20px;
        border-radius: 999px;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 13px;
        text-align: left;
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine);
        background:
          radial-gradient(ellipse 30% 26% at 50% 106%, rgba(255, 255, 255, 0.6), transparent 70%),
          radial-gradient(ellipse 58% calc(52% + var(--g) * 46%) at 50% 110%, var(--dc), transparent 72%),
          var(--card);
        transition: scale 0.2s var(--ease), box-shadow 0.2s;
      }
      .oval .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .oval svg { flex: none; width: 17px; height: 17px; }
      .st:nth-child(3n) .oval { --dc: rgb(175, 70, 255); }
      .st:nth-child(3n + 1) .oval { --dc: rgb(255, 150, 40); }
      .st.me .oval { --dc: var(--live); }
      .st.heard { opacity: 0.5; }
      .st.on { color: var(--ink); opacity: 1; }
      .st.on .oval { --g: var(--lv); box-shadow: inset 0 0 0 1.5px var(--edge-on), inset 0 1px 0 var(--shine); }
      .st:active .oval { scale: 0.95; }

      .chan { display: inline-flex; align-items: center; gap: 3px; min-height: 30px; padding: 0 10px; margin-top: 8px; border-radius: 15px; font-size: 12.5px; color: var(--ink-2); }
      .chan:hover { background: var(--glass); }
      .chan svg { width: 13px; height: 13px; }
      .chan[hidden] { display: none; }

      /* ===== dock: стеклянная панель разделов; сияние стоит под выбранным и дышит от голоса ===== */
      .dock {
        position: absolute;
        inset: auto 16px max(18px, env(safe-area-inset-bottom));
        z-index: 3;
        display: flex;
        gap: 10px;
      }
      .dock-beam { flex: 1; min-width: 0; border-radius: 32px; }
      .dock-bar {
        height: 64px;
        border-radius: 32px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        background: var(--dock);
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }
      .dock-tab {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 3px;
        font-size: 11px;
        color: var(--ink-2);
        border-radius: 32px;
        transition: color 0.2s;
      }
      .dock-tab.on { color: var(--ink); }
      .dock-tab:focus-visible { outline-offset: -4px; }
      .dock-ico { position: relative; display: block; }
      .dock-ico svg { width: 22px; height: 22px; display: block; }
      .mic-beam { flex: none; border-radius: 32px; }
      .dock .main {
        width: 64px;
        height: 64px;
        background: var(--dock);
        color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--shine);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
      }
      .dock .main svg { position: relative; z-index: 1; }
      /* идёт запись — на экране только она */
      .stage.busy .dock, .stage.busy .page { display: none; }

      @media (prefers-reduced-motion: reduce) {
        .small, .main, .pill, .tile, .tile::before, .row, .sheet, .scrim, .page, .dock-tab, .shape, .oval, .st, .tray, .rx, .fxb, .anchor { transition: none; }
        .rx, .rx::before, .rx::after, .rx .e, .tray.open .rx, .pin { animation: none !important; }
        .halo { animation: none; }
      }
    
</style>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="glow"></div>
      <div class="shape halo"></div>
      <div class="shape ring" style="--k: 0.62"></div>
      <div class="shape ring" style="--k: 0.44"></div>
      <div class="shape ring" style="--k: 0.28"></div>
      <div class="shape ring" style="--k: 0.14"></div>
      <div class="shape cap" id="cap"></div>

      <header class="top">
        <div class="bar">
          <button class="small" id="back" aria-label="Назад в эфир" hidden></button>
        </div>
        <div class="stories" id="stories" aria-label="Голоса эфира"></div>
        <div class="meta">
          <button class="chan" id="chan" aria-label="Выбрать канал"></button>
          <div class="who" id="who"></div>
          <div class="hook" id="hook"></div>
          <div class="hint" id="hint" aria-live="polite"></div>
        </div>
      </header>

      <footer class="bottom" id="bottom">
        <div class="side"><button class="small" id="left"></button><span class="label" id="leftl"></span></div>
        <div class="mainwrap">
          <button class="main" id="main"></button>
          <div class="label" id="label"></div>
        </div>
        <div class="side end"><button class="small" id="right"></button><span class="label" id="rightl"></span></div>
      </footer>
      <div class="fx" id="fx" aria-label="Эффекты"></div>
      <div class="tray" id="tray" role="group" aria-label="Аудио-реакции"></div>

      <div class="track" id="track" role="slider" tabindex="0" aria-label="Место в записи" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="wave" id="wave"></div>
        <div class="wave lit" id="waveLit"></div>
        <i class="head"></i>
        <i class="anchor"></i>
        <div class="pins" id="pins"></div>
      </div>
      <div class="page" id="page"></div>
      <nav class="dock" id="dock" aria-label="Разделы"></nav>

      <div class="scrim" id="scrim"></div>
      <section class="sheet" id="sheet" aria-label="Лист"></section>
    </main>
    <script type="module" src="./capsule.ts"></script>
  </body>
</html>
